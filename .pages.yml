# =============================================================
# Pages CMS Configuration (.pages.yml)
# Docs: https://pagescms.org/docs
# =============================================================

media:
  input: "src/assets/uploads"
  output: "/assets/uploads"

content:
  # ===========================================================
  # 1. Blog Articles Collection
  # ===========================================================
  - name: blog
    label: Blog Articles
    type: collection
    path: "src/content/blog"
    filename: "{year}-{month}-{day}-{slug}.md"
    fields:
      - name: draft
        label: Draft Mode
        type: boolean
        default: false
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: description
        label: Description
        type: text
      - name: image
        label: Cover Image
        type: image
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body Content
        type: rich-text

  # ===========================================================
  # 2. Portfolio Projects Collection
  # ===========================================================
  - name: portfolio
    label: Portfolio Projects
    type: collection
    path: "src/content/portfolio"
    filename: "{slug}.md"
    fields:
      - name: draft
        label: Draft Mode
        type: boolean
        default: false
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
      - name: summary
        label: Summary
        type: text
      - name: featured
        label: Featured on Homepage
        type: boolean
        default: false
      - name: image
        label: Cover Image
        type: image
      - name: client
        label: Client / Category
        type: string
      - name: role
        label: Role
        type: string
      - name: liveUrl
        label: Live Project URL
        type: string
      - name: githubUrl
        label: GitHub Repository URL
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: body
        label: Body Content
        type: rich-text

  # ===========================================================
  # 3. Pages & Global Data Files
  # ===========================================================
  - name: home
    label: Home Page
    type: file
    path: "src/_data/home.json"
    fields:
      - name: draft
        label: Draft Mode
        type: boolean
        default: false
      - name: title
        label: Page Title
        type: string
      - name: heroBadge
        label: Hero Badge
        type: string
      - name: heroHeadline
        label: Hero Headline
        type: string
      - name: heroDescription
        label: Hero Description
        type: text
      - name: heroImage
        label: Hero Profile Image
        type: image
      - name: portfolioHeading
        label: Portfolio Section Heading
        type: string
      - name: portfolioSubheading
        label: Portfolio Section Subheading
        type: string
      - name: blogHeading
        label: Blog Section Heading
        type: string

  - name: about
    label: About Page
    type: file
    path: "src/_data/about.json"
    fields:
      - name: draft
        label: Draft Mode
        type: boolean
        default: false
      - name: title
        label: Page Title
        type: string
      - name: description
        label: Page Description
        type: text
      - name: headline
        label: Headline
        type: string
      - name: profileImage
        label: Profile Image
        type: image
      - name: statusLocation
        label: Status Location
        type: string
      - name: bioShort
        label: Short Bio
        type: text
      - name: metrics
        label: Highlight Metrics
        type: object
        list: true
        fields:
          - name: value
            label: Metric Value (e.g. 3+)
            type: string
          - name: label
            label: Metric Label
            type: string
      - name: journeyHeadline
        label: Journey Section Headline
        type: string
      - name: journeyParagraphs
        label: Journey Paragraphs
        type: object
        list: true
        fields:
          - name: para
            label: Paragraph Text
            type: text

  - name: resume
    label: Resume / CV Page
    type: file
    path: "src/_data/resume.json"
    fields:
      - name: draft
        label: Draft Mode
        type: boolean
        default: false
      - name: title
        label: Page Title
        type: string
      - name: description
        label: Page Description
        type: text
      - name: heading
        label: Heading
        type: string
      - name: updated
        label: Last Updated Note
        type: string
      - name: roleHeadline
        label: Role Headline
        type: string
      - name: summary
        label: Executive Summary
        type: text
      - name: location
        label: Location
        type: string
      - name: education
        label: Education
        type: object
        fields:
          - name: degree
            label: Degree
            type: string
          - name: period
            label: Period
            type: string
          - name: field
            label: Field / Institution
            type: string
          - name: focus
            label: Core Focus
            type: text
      - name: competencies
        label: Technical Competencies
        type: object
        list: true
        fields:
          - name: category
            label: Category
            type: string
          - name: details
            label: Details
            type: text
      - name: certifications
        label: Industry Certifications
        type: object
        list: true
        fields:
          - name: title
            label: Certificate Title
            type: string
          - name: badge
            label: Badge / Type
            type: string
          - name: issuer
            label: Issuing Organization
            type: string
          - name: issued
            label: Date Issued
            type: string
          - name: url
            label: Credly / Verification URL
            type: string
          - name: skills
            label: Skills
            type: string
            list: true

  - name: techStack
    label: Infinite Scroll Tech Stack
    type: file
    path: "src/_data/techStack.json"
    fields:
      - name: enabled
        label: Enable Ticker Strip
        type: boolean
        default: true
      - name: speed
        label: Scroll Speed (seconds)
        type: number
        default: 38
      - name: items
        label: Tech Stack Items
        type: object
        list: true
        fields:
          - name: name
            label: Technology Name
            type: string
          - name: icon
            label: Icon Preset
            type: select
            options:
              - python
              - java
              - aws
              - database
              - typescript
              - javascript
              - react
              - nextjs
              - tailwind
              - node
              - eleventy
              - html
              - css
              - git
              - docker
              - vite
              - graphql
              - vue
              - svelte
              - astro
              - sass
              - vscode
              - prettier
              - code
              - custom
            default: code
          - name: customIcon
            label: Custom Icon Image File
            type: image

  - name: site
    label: Site Settings & SEO
    type: file
    path: "src/_data/site.json"
    fields:
      - name: name
        label: Author Name
        type: string
      - name: title
        label: Default Site Title
        type: string
      - name: description
        label: Default Description
        type: text
      - name: url
        label: Canonical URL
        type: string
      - name: image
        label: Social Share Image
        type: image
      - name: role
        label: Role / Tagline
        type: string
      - name: github
        label: GitHub URL
        type: string
      - name: linkedin
        label: LinkedIn URL
        type: string
      - name: twitter
        label: Twitter URL
        type: string

  - name: banners
    label: Banners & Notices
    type: file
    path: "src/_data/banners.json"
    fields:
      - name: announcement
        label: Announcement Banner
        type: object
        fields:
          - name: enabled
            label: Enable Announcement
            type: boolean
            default: true
          - name: badge
            label: Badge Label
            type: string
          - name: text
            label: Banner Text
            type: string
          - name: link
            label: Target Link URL
            type: string
          - name: linkText
            label: Link Button Text
            type: string
      - name: cookieConsent
        label: Cookie Consent Notice
        type: object
        fields:
          - name: enabled
            label: Enable Cookie Notice
            type: boolean
            default: true
          - name: title
            label: Title
            type: string
          - name: message
            label: Message
            type: text
