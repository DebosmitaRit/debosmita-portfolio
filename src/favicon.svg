<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
    <defs>
        <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#18181b"/>
            <stop offset="100%" stop-color="#09090b"/>
        </linearGradient>
        <linearGradient id="favBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#3f3f46"/>
            <stop offset="100%" stop-color="#27272a"/>
        </linearGradient>
    </defs>

    <!-- Card background squircle with subtle border -->
    <rect width="64" height="64" rx="16" fill="url(#favBg)"/>
    <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="url(#favBorder)" stroke-width="1.5"/>

    <!-- Thin typography DR monogram -->
    <text
            x="32"
            y="40.5"
            text-anchor="middle"
            fill="#ffffff"
            font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Inter', 'Geist', 'Segoe UI', sans-serif"
            font-size="26"
            font-weight="300"
            letter-spacing="2px"
    >DR
    </text>

    <!-- Refined emerald accent pip -->
    <circle cx="50" cy="18" r="2.5" fill="#10b981"/>
</svg>
